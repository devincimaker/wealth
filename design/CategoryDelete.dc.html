<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@500;600;700&display=swap">
  <style>
    body { margin:0; font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif; background:#0E0F13; }
    a { color:#6E8BFF; } a:hover { color:#8CA2FF; }
    .mono { font-family:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,monospace; }
    .ghostrow { height:56px; border-radius:14px; background:#171A21; }
    .opt { display:flex; align-items:center; gap:12px; padding:13px 16px; }
    .radio { width:20px; height:20px; border-radius:10px; border:1.5px solid #3A3F4C; flex-shrink:0; }
    .radio.on { border-color:#4F68E8; background:radial-gradient(circle, #4F68E8 0 5px, transparent 6px); }
    .olabel { font-size:14px; font-weight:500; color:#F3F4F8; }
    .osub { font-size:12px; color:#616774; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0E0F13;color:#F3F4F8;position:relative;overflow:hidden">

  <div style="position:absolute;inset:0;opacity:0.14;display:flex;flex-direction:column;gap:14px;padding:64px 20px">
    <div style="width:150px;height:26px;border-radius:8px;background:#3A3F4C"></div>
    <div style="height:10px"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
    <div class="ghostrow"></div>
  </div>

  <div style="position:absolute;inset:0;background:rgba(8,9,12,0.72)"></div>

  <div style="position:absolute;left:32px;right:32px;top:214px;background:#171A21;border:1px solid #272B35;border-radius:24px;padding:24px 20px 16px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,0.5)">

    <div style="display:flex;flex-direction:column;gap:8px;padding:0 4px">
      <div style="font-size:18px;font-weight:700">Delete “Travel”?</div>
      <div style="font-size:13px;color:#9AA0AF;line-height:1.5">12 expenses use this category. Where should they go?</div>
    </div>

    <div style="background:#12141A;border:1px solid #22252E;border-radius:16px;display:flex;flex-direction:column">
      <div class="opt">
        <span class="radio on"></span>
        <div style="display:flex;flex-direction:column;gap:1px">
          <span class="olabel">Move to “Other”</span>
          <span class="osub">Pick any category</span>
        </div>
      </div>
      <div style="height:1px;background:#22252E;margin:0 16px"></div>
      <div class="opt">
        <span class="radio"></span>
        <div style="display:flex;flex-direction:column;gap:1px">
          <span class="olabel">Leave uncategorized</span>
          <span class="osub">They keep their amounts and dates</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="height:50px;border-radius:15px;background:#C43C3C;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:15px;font-weight:600">Delete category</div>
      <div style="display:flex;align-items:center;justify-content:center;height:44px;color:#9AA0AF;font-size:15px;font-weight:500">Cancel</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
