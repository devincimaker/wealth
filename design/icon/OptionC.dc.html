<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@500;600&display=swap">
  <style>
    body { margin:0; font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif; background:#0E0F13; }
    a { color:#6E8BFF; } a:hover { color:#8CA2FF; }
    .eyebrow { font-family:'Spline Sans Mono',ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:0.14em; color:#616774; font-weight:600; }
    .sizelabel { font-family:'Spline Sans Mono',ui-monospace,Menlo,monospace; font-size:11px; color:#616774; font-variant-numeric:tabular-nums; }
  </style>
</helmet>
<div style="width:380px;height:520px;background:#0E0F13;color:#F3F4F8;display:flex;flex-direction:column;gap:22px;padding:32px;box-sizing:border-box">

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1B1F29"></stop>
        <stop offset="1" stop-color="#12141B"></stop>
      </linearGradient>
    </defs>
  </svg>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">OPTION C</div>
    <div style="font-size:20px;font-weight:600">Waveform</div>
    <div style="font-size:13px;color:#9AA0AF;line-height:1.5">The voice waveform from the capture gesture, the app's headline feature, with the amber peak marking the moment you speak.</div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:24px">
    <svg viewBox="0 0 100 100" style="width:200px;height:200px;filter:drop-shadow(0 10px 28px rgba(0,0,0,0.5))">
      <path d="M50 0C11 0 0 11 0 50s11 50 50 50 50-11 50-50S89 0 50 0Z" fill="url(#cbg)"></path>
      <rect x="21" y="42" width="9" height="16" rx="4.5" fill="#39415E"></rect>
      <rect x="34" y="34" width="9" height="32" rx="4.5" fill="#4A557E"></rect>
      <rect x="47" y="24" width="9" height="52" rx="4.5" fill="#E8B45A"></rect>
      <rect x="60" y="31" width="9" height="38" rx="4.5" fill="#5B6CA6"></rect>
      <rect x="73" y="42" width="9" height="16" rx="4.5" fill="#39415E"></rect>
    </svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg viewBox="0 0 100 100" style="width:58px;height:58px">
        <path d="M50 0C11 0 0 11 0 50s11 50 50 50 50-11 50-50S89 0 50 0Z" fill="url(#cbg)"></path>
        <rect x="21" y="42" width="9" height="16" rx="4.5" fill="#39415E"></rect>
        <rect x="34" y="34" width="9" height="32" rx="4.5" fill="#4A557E"></rect>
        <rect x="47" y="24" width="9" height="52" rx="4.5" fill="#E8B45A"></rect>
        <rect x="60" y="31" width="9" height="38" rx="4.5" fill="#5B6CA6"></rect>
        <rect x="73" y="42" width="9" height="16" rx="4.5" fill="#39415E"></rect>
      </svg>
      <span class="sizelabel">58</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg viewBox="0 0 100 100" style="width:40px;height:40px">
        <path d="M50 0C11 0 0 11 0 50s11 50 50 50 50-11 50-50S89 0 50 0Z" fill="url(#cbg)"></path>
        <rect x="21" y="42" width="9" height="16" rx="4.5" fill="#39415E"></rect>
        <rect x="34" y="34" width="9" height="32" rx="4.5" fill="#4A557E"></rect>
        <rect x="47" y="24" width="9" height="52" rx="4.5" fill="#E8B45A"></rect>
        <rect x="60" y="31" width="9" height="38" rx="4.5" fill="#5B6CA6"></rect>
        <rect x="73" y="42" width="9" height="16" rx="4.5" fill="#39415E"></rect>
      </svg>
      <span class="sizelabel">40</span>
    </div>
  </div>

  <div style="font-size:12px;color:#616774;line-height:1.55">Motivation: it is the one gesture that makes this app yours, and no finance app looks like this. Tradeoff: it says voice memo before it says money.</div>

</div>
</x-dc>
</body>
</html>
