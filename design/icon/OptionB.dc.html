<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@500;600&display=swap">
  <style>
    body { margin:0; font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif; background:#0E0F13; }
    a { color:#6E8BFF; } a:hover { color:#8CA2FF; }
    .eyebrow { font-family:'Spline Sans Mono',ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:0.14em; color:#616774; font-weight:600; }
    .sizelabel { font-family:'Spline Sans Mono',ui-monospace,Menlo,monospace; font-size:11px; color:#616774; font-variant-numeric:tabular-nums; }
  </style>
</helmet>
<div style="width:380px;height:520px;background:#0E0F13;color:#F3F4F8;display:flex;flex-direction:column;gap:22px;padding:32px;box-sizing:border-box">

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1B1F29"></stop>
        <stop offset="1" stop-color="#12141B"></stop>
      </linearGradient>
      <linearGradient id="bacc" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6E8BFF"></stop>
        <stop offset="1" stop-color="#4F68E8"></stop>
      </linearGradient>
    </defs>
  </svg>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">OPTION B</div>
    <div style="font-size:20px;font-weight:600">Month bars</div>
    <div style="font-size:13px;color:#9AA0AF;line-height:1.5">The Months tab mark scaled up: three ascending bars climbing the ramp from dim to the accent.</div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:24px">
    <svg viewBox="0 0 100 100" style="width:200px;height:200px;filter:drop-shadow(0 10px 28px rgba(0,0,0,0.5))">
      <path d="M50 0C11 0 0 11 0 50s11 50 50 50 50-11 50-50S89 0 50 0Z" fill="url(#bbg)"></path>
      <rect x="24" y="52" width="13" height="22" rx="6.5" fill="#39415E"></rect>
      <rect x="43.5" y="40" width="13" height="34" rx="6.5" fill="#5B6CA6"></rect>
      <rect x="63" y="26" width="13" height="48" rx="6.5" fill="url(#bacc)"></rect>
    </svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg viewBox="0 0 100 100" style="width:58px;height:58px">
        <path d="M50 0C11 0 0 11 0 50s11 50 50 50 50-11 50-50S89 0 50 0Z" fill="url(#bbg)"></path>
        <rect x="24" y="52" width="13" height="22" rx="6.5" fill="#39415E"></rect>
        <rect x="43.5" y="40" width="13" height="34" rx="6.5" fill="#5B6CA6"></rect>
        <rect x="63" y="26" width="13" height="48" rx="6.5" fill="url(#bacc)"></rect>
      </svg>
      <span class="sizelabel">58</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg viewBox="0 0 100 100" style="width:40px;height:40px">
        <path d="M50 0C11 0 0 11 0 50s11 50 50 50 50-11 50-50S89 0 50 0Z" fill="url(#bbg)"></path>
        <rect x="24" y="52" width="13" height="22" rx="6.5" fill="#39415E"></rect>
        <rect x="43.5" y="40" width="13" height="34" rx="6.5" fill="#5B6CA6"></rect>
        <rect x="63" y="26" width="13" height="48" rx="6.5" fill="url(#bacc)"></rect>
      </svg>
      <span class="sizelabel">40</span>
    </div>
  </div>

  <div style="font-size:12px;color:#616774;line-height:1.55">Motivation: instantly legible as money and progress, and it is already the app's own tab glyph. Tradeoff: the closest of the three to a generic finance icon.</div>

</div>
</x-dc>
</body>
</html>
